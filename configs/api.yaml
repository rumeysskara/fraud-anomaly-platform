# API settings (Step 10). Every key is optional; the defaults live in src/api/config.py.
llm:
  timeout_seconds: 120       # total deadline of /explain and /rag/query; on expiry facts are returned (K-51)
  planner_timeout_seconds: 20     # /explain: LLM planner share (only when a question is given)
  explainer_timeout_seconds: 100  # /explain: RAG explanation share; planner + explainer <= total
online:
  result_cache_size: 5000    # /score results kept for idempotency (per TransactionID)
  record_cache_size: 256     # full feature records kept so /explain of a scored id matches
health:
  ollama_timeout_seconds: 2
rag:
  max_k: 10
warmup:
  enabled: true              # at startup, one short embedding + chat request in the background (K-50)
  embedding_text: warm-up
  llm_prompt: "Yalnızca 'tamam' yaz."
