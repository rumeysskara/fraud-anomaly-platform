# Layer weights of the weighted-average aggregation (decision K-17). Must sum to 1.
# Chosen by hand, label-free; they are NOT tuned on holdout metrics (isFraud is never read here).
weights:
  multivariate: 0.35
  entity: 0.25
  column: 0.20
  temporal: 0.20

rationale:
  multivariate: "Widest view: joint behaviour of 90 inputs (75 engineered/C/D columns + 15 missingness flags, reports/scores/mv_input.csv), catches combinations no single column shows."
  entity: "Deviation from the card group's own history; strong signal but only available where history exists (shrinkage covers the rest)."
  column: "Single-column tail evidence on a curated explainable subset; simple and readable, but blind to combinations."
  temporal: "Velocity / hour / inter-arrival evidence; narrower scope, kept at the lowest weight together with column."
