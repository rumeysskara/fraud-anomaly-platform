[project]
name = "fraud-anomaly-platform"
version = "0.1.0"
description = "Multi-layer anomaly detection platform on IEEE-CIS fraud data"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '/(\.venv)/'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ollama: needs a running Ollama and the built RAG index (run with -m ollama)",
    "real_data: reads the real IEEE-CIS sample artifacts; not in the default suite (run with -m real_data)",
]
addopts = "-m 'not real_data'"
